<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lineage Connect - Under Construction</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      color: #fff;
    }
    .logo span { color: #4f9cf9; }
    .tagline {
      font-size: 1.1rem;
      color: #888;
      margin-bottom: 3rem;
    }
    .card {
      background: #111118;
      border: 1px solid #1e1e2e;
      border-radius: 16px;
      padding: 3rem 4rem;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #fff;
    }
    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #999;
      margin-bottom: 2rem;
    }
    .progress {
      height: 4px;
      background: #1e1e2e;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }
    .progress-bar {
      height: 100%;
      width: 60%;
      background: #4f9cf9;
      border-radius: 2px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .status {
      font-size: 0.875rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    footer {
      position: fixed;
      bottom: 2rem;
      font-size: 0.8rem;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="logo">Lineage <span>Connect</span></div>
  <div class="tagline">Municipal Utility Print-to-Mail Solutions</div>

  <div class="card">
    <div class="icon">🚧</div>
    <h1>Under Construction</h1>
    <p>We are building something great. The Lineage Connect utility billing platform is coming soon.</p>
    <div class="progress">
      <div class="progress-bar"></div>
    </div>
    <div class="status">Launching Q3 2026</div>
  </div>

  <footer>© 2026 Lineage Connect. All rights reserved.</footer>
</body>
</html>
